<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .title-main { font-family: 'Arial', sans-serif; font-size: 38px; font-weight: 900; fill: #1a1a1a; text-anchor: middle; }
      .title-sub { font-family: 'Arial', sans-serif; font-size: 14px; font-weight: bold; fill: #8a8a8a; text-anchor: middle; letter-spacing: 1px; }
      .title-desc { font-family: 'Arial', sans-serif; font-size: 18px; fill: #4a4a4a; text-anchor: middle; }
      .card-num { font-family: 'Arial', sans-serif; font-size: 32px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
      .card-text { font-family: 'Arial', sans-serif; font-size: 12px; fill: #333333; text-anchor: middle; font-weight: 500; }
      .chasm-text { font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; fill: #ffffff; text-anchor: middle; letter-spacing: 6px; }
      .shadow { filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.08)); }
    </style>
  </defs>

  <rect width="1000" height="680" fill="#f8f9fa" />
  
  <rect x="30" y="360" width="940" height="230" fill="#eef1f4" />
  <rect x="0" y="360" width="30" height="230" fill="#e5dec9" />
  <rect x="970" y="360" width="30" height="230" fill="#e5dec9" />

  <text x="500" y="50" class="title-sub">Lozen Advisory</text>
  <text x="500" y="105" class="title-main">The Name Standard<tspan dy="-15" font-size="18px">SM</tspan></text>
  <text x="500" y="145" class="title-desc">Five pillars bridge the governance chasm</text>

  <path d="M 20,360 Q 500,160 980,360" stroke="#ababab" stroke-width="14" fill="none" stroke-linecap="round" />

  <line x1="130" y1="290" x2="130" y2="430" stroke="#0097a7" stroke-width="10" stroke-linecap="round" />
  <line x1="315" y1="198" x2="315" y2="430" stroke="#a3b2ff" stroke-width="10" stroke-linecap="round" />
  <line x1="500" y1="168" x2="500" y2="430" stroke="#ffd600" stroke-width="10" stroke-linecap="round" />
  <line x1="685" y1="198" x2="685" y2="430" stroke="#006064" stroke-width="10" stroke-linecap="round" />
  <line x1="870" y1="290" x2="870" y2="430" stroke="#676fa3" stroke-width="10" stroke-linecap="round" />

  <rect x="5" y="355" width="990" height="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1" rx="2" />

  <g class="shadow">
    <rect x="75" y="415" width="110" height="145" fill="#ffffff" rx="1" />
    <text x="130" y="455" class="card-num">1</text>
    <text x="130" y="490" class="card-text">Time</text>
    <text x="130" y="508" class="card-text">allocation</text>
  </g>

  <g class="shadow">
    <rect x="260" y="415" width="110" height="145" fill="#ffffff" rx="1" />
    <text x="315" y="455" class="card-num">2</text>
    <text x="315" y="485" class="card-text">Review</text>
    <text x="315" y="503" class="card-text">capacity</text>
    <text x="315" y="521" class="card-text">&amp; tools</text>
  </g>

  <g class="shadow">
    <rect x="445" y="415" width="110" height="145" fill="#ffffff" rx="1" />
    <text x="500" y="455" class="card-num">3</text>
    <text x="500" y="490" class="card-text">Information</text>
    <text x="500" y="508" class="card-text">access</text>
  </g>

  <g class="shadow">
    <rect x="630" y="415" width="110" height="145" fill="#ffffff" rx="1" />
    <text x="685" y="455" class="card-num">4</text>
    <text x="685" y="490" class="card-text">Documentation</text>
    <text x="685" y="508" class="card-text">infrastructure</text>
  </g>

  <g class="shadow">
    <rect x="815" y="415" width="110" height="145" fill="#ffffff" rx="1" />
    <text x="870" y="455" class="card-num">5</text>
    <text x="870" y="485" class="card-text">Formal</text>
    <text x="870" y="503" class="card-text">right of</text>
    <text x="870" y="521" class="card-text">refusal</text>
  </g>

  <g>
    <rect x="50" y="590" width="900" height="70" fill="#2A6F97" />
    
    <path d="M 70,610 Q 200,600 350,610 T 650,610 T 930,610" stroke="#4682B4" stroke-width="2" fill="none" opacity="0.4" />
    <path d="M 80,640 Q 250,632 450,640 T 800,640 T 920,640" stroke="#1d4e6d" stroke-width="2" fill="none" opacity="0.5" />
    
    <text x="500" y="632" class="chasm-text">GOVERNANCE CHASM</text>
  </g>
</svg>
