<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<title>Lozen Advisory's Name Standard - curved bridge over the governance chasm</title>
<desc>A flat illustration of a white curved arch bridge spanning a canyon labeled the governance chasm, with five colored hangers representing the five pillars of the Name Standard.</desc>

