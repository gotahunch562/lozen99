<text x="800" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#222222">The Name Standard&#8480;</text>
<text x="800" y="178" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#555555">Five pillars bridge the governance chasm</text>

<rect x="0" y="420" width="260" height="480" fill="#E7E3D8" stroke="#C9C4B8" stroke-width="1"/>
