<text x="800" y="693" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="3" fill="#FFFFFF">GOVERNANCE CHASM</text>

<path d="M260,420 Q800,0 1340,420" fill="none" stroke="#AFAFAF" stroke-width="16" stroke-linecap="round"/>
<rect x="240" y="414" width="1120" height="14" rx="3" fill="#F2F2F2" stroke="#B0B0B0" stroke-width="1.5"/>

